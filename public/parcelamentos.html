<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>FZCONT · Parcelamentos</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/style.css" />
</head>
<body>

  <div id="app" class="tela-cheia">

    <header class="topo">
      <div class="topo-esquerda">
        <div class="logo-marca pequena">FZ</div>
        <div>
          <h1>FZCONT</h1>
          <span id="usuario-logado" class="usuario-atual"></span>
        </div>
      </div>

      <div class="topo-busca">
        <input type="text" id="busca" placeholder="Buscar parcelamento..." />
      </div>

      <nav class="topo-acoes">
        <a href="/empresas.html" class="link-nav">Empresas</a>
        <a href="/parcelamentos.html" class="link-nav ativo">Parcelamentos</a>
        <button class="btn-ghost" id="btn-usuarios">Usuários</button>
        <button class="btn-primario" id="btn-salvar">Salvar</button>
        <button class="btn-secundario" id="btn-salvar-periodo">Salvar Período</button>
        <button class="btn-secundario" id="btn-abrir-periodo">Abrir Período</button>
        <button class="btn-secundario" id="btn-exportar-backup">Exportar Backup</button>
        <button class="btn-secundario" id="btn-importar-backup">Importar Backup</button>
        <input type="file" id="input-importar-backup" accept="application/json" class="oculto" />
        <button class="btn-perigo-outline" id="btn-nova-lista">Nova Lista</button>
        <button class="btn-ghost" id="btn-sair">Sair</button>
      </nav>
    </header>

    <div id="status-salvar" class="status-salvar oculto"></div>

    <main class="conteudo conteudo-coluna">
      <div id="dashboard-parcelamentos" class="dashboard"></div>
      <section class="painel-esquerdo largura-total">
        <div class="painel-cabecalho">
          <h2>Parcelamentos</h2>
          <button class="btn-secundario" id="btn-novo-parcelamento">+ Parcelamento</button>
        </div>
        <div id="lista-parcelamentos" class="grade-parcelamentos"></div>
      </section>
    </main>

  </div>

  <div id="modal-fundo" class="modal-fundo oculto">
    <div id="modal-conteudo" class="modal-conteudo"></div>
  </div>

  <script src="/common.js"></script>
  <script src="/parcelamentos.js"></script>
</body>
</html>
