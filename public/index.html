<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SFC · Login</title>
<link rel="stylesheet" href="/style.css" />
</head>
<body>

  <div id="tela-login" class="tela-cheia">
    <div class="card-login">
      <div class="logo-login">
        <div class="logo-marca">SFC</div>
        <h1>Sistema Fiscal Contábil</h1>
        <p id="login-subtitulo">Entre com seu usuário e senha</p>
      </div>

      <div class="tabs-login">
        <button type="button" class="tab-login-btn ativa" data-modo="login">Entrar</button>
        <button type="button" class="tab-login-btn" data-modo="cadastro">Criar conta</button>
      </div>

      <form id="form-login" class="form-login" data-modo="login">
        <label>Usuário
          <input type="text" id="login-usuario" autocomplete="username" required />
        </label>
        <label>Senha
          <input type="password" id="login-senha" autocomplete="current-password" required />
        </label>
        <label id="campo-nome-setup" class="oculto">Seu nome
          <input type="text" id="login-nome" autocomplete="name" />
        </label>
        <label id="campo-email-setup" class="oculto">Seu e-mail
          <input type="email" id="login-email" autocomplete="email" />
        </label>
        <div id="login-erro" class="mensagem-erro oculto"></div>
        <button type="submit" id="btn-login-submit">Entrar</button>
      </form>
    </div>
  </div>

  <script src="/common.js"></script>
  <script src="/login.js"></script>
</body>
</html>
