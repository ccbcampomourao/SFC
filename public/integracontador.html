<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>FZCONT · IntegraContador</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/style.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/forge/1.3.1/forge.min.js"></script>
</head>
<body>

  <div id="app" class="tela-cheia app-shell">

    <aside class="app-sidebar" id="barra-lateral">
      <div class="app-sidebar-brand">
        <img src="/img/logo-mark.png" alt="FZCONT" />
        <div>
          <h1>FZCONT</h1>
          <span id="usuario-logado" class="usuario-atual"></span>
        </div>
      </div>

      <nav class="app-nav">
        <a href="/empresas.html" class="app-nav-link">📁 Empresas</a>
        <a href="/parcelamentos.html" class="app-nav-link">📄 Parcelamentos</a>
        <a href="/situacao-fiscal.html" class="app-nav-link">🧾 Situação Fiscal</a>
        <a href="/integracontador.html" class="app-nav-link ativo">🏛️ IntegraContador</a>
      </nav>

      <div class="app-sidebar-divider"></div>
      <div class="app-sidebar-titulo">Conta</div>
      <div class="app-sidebar-acoes">
        <button class="btn-ghost-side" id="btn-usuarios">👤 Usuários</button>
      </div>

      <div class="app-sidebar-footer">
        <button class="btn-ghost-side" id="btn-sair">Sair</button>
      </div>
    </aside>

    <div class="app-conteudo">
      <div class="faixa-superior">
        <button class="btn-toggle-sidebar" id="btn-toggle-sidebar" title="Abrir/fechar menu">☰</button>
        <div>
          <h2 style="font-size:15px;">IntegraContador (SERPRO)</h2>
          <span class="usuario-atual">Busca relatórios direto no navegador, sem salvar no Cloudflare — os arquivos baixam na sua máquina.</span>
        </div>
      </div>

      <div id="status-salvar" class="status-salvar oculto"></div>

      <main class="conteudo conteudo-coluna">

        <section class="painel-esquerdo largura-total">
          <div class="painel-cabecalho"><h2>Certificado Digital</h2></div>
          <div id="certificado-status" class="ic-status-box">Carregando…</div>
        </section>

        <section class="painel-esquerdo largura-total">
          <div class="painel-cabecalho"><h2>O que você quer baixar</h2></div>
          <div class="ic-servicos">
            <label class="chip-check ic-servico"><input type="checkbox" id="svc-sitfis" checked> Situação Fiscal (SITFIS)</label>
            <label class="chip-check ic-servico"><input type="checkbox" id="svc-cnd"> Certidão Negativa de Débitos (CND)</label>
          </div>
        </section>

        <section class="painel-esquerdo largura-total">
          <div class="painel-cabecalho">
            <h2>Empresas</h2>
            <div class="painel-acoes">
              <button class="btn-secundario" id="btn-marcar-todas">Marcar todas</button>
              <button class="btn-secundario" id="btn-desmarcar-todas">Desmarcar todas</button>
            </div>
          </div>
          <div id="lista-empresas-ic" class="ic-lista-empresas"></div>
        </section>

        <section class="painel-esquerdo largura-total">
          <button class="btn-primario" id="btn-baixar-selecionados" style="margin-bottom:14px;">⬇️ Baixar selecionados</button>
          <div id="resultado-ic" class="ic-resultados"></div>
        </section>

      </main>
    </div>

  </div>

  <div id="modal-fundo" class="modal-fundo oculto">
    <div id="modal-conteudo" class="modal-conteudo"></div>
  </div>

  <script src="/common.js"></script>
  <script src="/integracontador.js"></script>
</body>
</html>
