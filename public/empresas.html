<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>FZCONT · Empresas</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/style.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
</head>
<body>

  <div id="app" class="tela-cheia app-shell">

    <aside class="app-sidebar" id="barra-lateral">
      <div class="app-sidebar-brand">
        <img src="/img/logo-mark.png" alt="FZCONT" />
        <div>
          <h1>FZCONT</h1>
          <span id="usuario-logado" class="usuario-atual"></span>
        </div>
      </div>

      <nav class="app-nav">
        <a href="/empresas.html" class="app-nav-link ativo">📁 Empresas</a>
        <a href="/parcelamentos.html" class="app-nav-link">📄 Parcelamentos</a>
        <a href="/situacao-fiscal.html" class="app-nav-link">🧾 Situação Fiscal</a>
      </nav>

      <div class="app-sidebar-divider"></div>
      <div class="app-sidebar-titulo">Ações</div>
      <div class="app-sidebar-acoes">
        <button class="btn-ghost-side" id="btn-usuarios">👤 Usuários</button>
        <button class="btn-ghost-side" id="btn-salvar">💾 Salvar</button>
        <button class="btn-ghost-side" id="btn-salvar-periodo">🗂️ Salvar Período</button>
        <button class="btn-ghost-side" id="btn-abrir-periodo">📂 Abrir Período</button>
        <button class="btn-ghost-side" id="btn-importar-pdfs">📥 Importar PDFs</button>
        <input type="file" id="input-importar-pdfs" accept="application/pdf" multiple class="oculto" />
        <button class="btn-ghost-side" id="btn-exportar-backup">⬇️ Exportar Backup</button>
        <button class="btn-ghost-side" id="btn-importar-backup">⬆️ Importar Backup</button>
        <input type="file" id="input-importar-backup" accept="application/json" class="oculto" />
        <button class="btn-ghost-side btn-perigo-side" id="btn-nova-lista">🧹 Nova Lista</button>
      </div>

      <div class="app-sidebar-footer">
        <button class="btn-ghost-side" id="btn-sair">Sair</button>
      </div>
    </aside>

    <div class="app-conteudo">
      <div class="faixa-superior">
        <button class="btn-toggle-sidebar" id="btn-toggle-sidebar" title="Abrir/fechar menu">☰</button>
        <div class="topo-busca">
          <input type="text" id="busca" placeholder="Buscar empresa..." />
        </div>
      </div>

      <div id="status-salvar" class="status-salvar oculto"></div>

      <main class="conteudo conteudo-coluna">
        <div id="dashboard" class="dashboard"></div>
        <div class="duas-colunas">
          <section class="painel-esquerdo">
            <div class="painel-cabecalho">
              <h2>Grupos e Empresas</h2>
              <div class="painel-acoes">
                <button class="btn-secundario" id="btn-novo-grupo">+ Grupo</button>
              </div>
            </div>
            <div id="lista-grupos" class="lista-grupos"></div>
          </section>

          <aside class="painel-direito">
            <div class="painel-cabecalho">
              <h2>Tarefas do Dia</h2>
              <button class="btn-secundario" id="btn-nova-tarefa">+ Tarefa</button>
            </div>
            <div id="lista-checklist" class="lista-checklist"></div>
          </aside>
        </div>
      </main>
    </div>

  </div>

  <div id="modal-fundo" class="modal-fundo oculto">
    <div id="modal-conteudo" class="modal-conteudo"></div>
  </div>

  <script src="/common.js"></script>
  <script src="/empresas.js"></script>
</body>
</html>
